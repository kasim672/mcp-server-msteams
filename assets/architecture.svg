<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bgGrad)" rx="16"/>

  <!-- Outer Border -->
  <rect width="958" height="518" x="1" y="1" fill="none" stroke="#374151" stroke-width="1" rx="15"/>

  <!-- Title Section -->
  <text x="480" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">
    mcp-server-msteams Architecture &amp; Data Flow
  </text>
  <text x="480" y="68" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
    Native local execution connecting AI Agents to Microsoft Teams without Azure App Registration
  </text>

  <!-- COLUMN 1: AI Clients & CLI -->
  <g transform="translate(40, 100)">
    <rect width="240" height="380" fill="url(#cardGrad)" rx="12" stroke="#374151" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="42" fill="#374151" rx="12" rx="12"/>
    <rect width="240" height="20" y="22" fill="#374151"/>
    <text x="120" y="26" fill="#f3f4f6" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">AI Clients &amp; Callers</text>

    <!-- Client Items -->
    <rect x="20" y="60" width="200" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="35" y="87" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="500">Claude Desktop / Cursor</text>

    <rect x="20" y="116" width="200" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="35" y="143" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="500">Windsurf / Antigravity</text>

    <rect x="20" y="172" width="200" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="35" y="199" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="500">Zed / Custom MCP Agent</text>

    <rect x="20" y="228" width="200" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="35" y="255" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="600">msteams CLI (terminal)</text>

    <!-- Protocol Label -->
    <g transform="translate(20, 300)">
      <rect width="200" height="54" rx="8" fill="#0f172a" stroke="#6366f1" stroke-dasharray="4" stroke-width="1"/>
      <text x="100" y="24" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MCP Stdio Protocol</text>
      <text x="100" y="42" fill="#64748b" font-family="system-ui" font-size="11" text-anchor="middle">JSON-RPC 2.0 (Stdin/Stdout)</text>
    </g>
  </g>

  <!-- COLUMN 2: MCP Server Core Engine -->
  <g transform="translate(360, 100)">
    <rect width="240" height="380" fill="url(#cardGrad)" rx="12" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="42" fill="url(#purpleGrad)" rx="12"/>
    <rect width="240" height="20" y="22" fill="#8b5cf6"/>
    <text x="120" y="26" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">mcp-server-msteams</text>

    <!-- Core Boxes -->
    <rect x="18" y="55" width="204" height="44" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="32" y="78" fill="#c7d2fe" font-family="system-ui" font-size="12" font-weight="600">MCP Tool Registry</text>
    <text x="32" y="93" fill="#818cf8" font-family="system-ui" font-size="10">30+ Zod-Validated Tools</text>

    <rect x="18" y="110" width="204" height="48" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="32" y="131" fill="#c7d2fe" font-family="system-ui" font-size="12" font-weight="600">MSAL Token Refresh Daemon</text>
    <text x="32" y="147" fill="#818cf8" font-family="system-ui" font-size="10">Silent HTTP 1s OAuth Refresh</text>

    <rect x="18" y="170" width="204" height="48" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="32" y="191" fill="#c7d2fe" font-family="system-ui" font-size="12" font-weight="600">Playwright Browser Engine</text>
    <text x="32" y="207" fill="#818cf8" font-family="system-ui" font-size="10">Edge | Chrome | Brave | Chromium</text>

    <rect x="18" y="230" width="204" height="48" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="32" y="251" fill="#c7d2fe" font-family="system-ui" font-size="12" font-weight="600">Assignments Automator</text>
    <text x="32" y="267" fill="#818cf8" font-family="system-ui" font-size="10">Attach Files &amp; Submission State</text>

    <!-- Storage Badge -->
    <g transform="translate(18, 292)">
      <rect width="204" height="66" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="102" y="22" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">~/.teams-mcp-server/</text>
      <text x="102" y="38" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">Encrypted Session (AES-256-GCM)</text>
      <text x="102" y="52" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle">Persistent Browser Cookie Profile</text>
    </g>
  </g>

  <!-- COLUMN 3: Microsoft Cloud APIs -->
  <g transform="translate(680, 100)">
    <rect width="240" height="380" fill="url(#cardGrad)" rx="12" stroke="#374151" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="42" fill="#1e293b" rx="12"/>
    <rect width="240" height="20" y="22" fill="#1e293b"/>
    <text x="120" y="26" fill="#f3f4f6" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Microsoft Cloud Services</text>

    <!-- API Items -->
    <rect x="18" y="60" width="204" height="48" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="32" y="81" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">Teams Messaging</text>
    <text x="32" y="98" fill="#64748b" font-family="monospace" font-size="10">chatsvcagg.teams.microsoft.com</text>

    <rect x="18" y="120" width="204" height="48" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="32" y="141" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">Substrate Search &amp; Mail</text>
    <text x="32" y="158" fill="#64748b" font-family="monospace" font-size="10">substrate.office.com</text>

    <rect x="18" y="180" width="204" height="48" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="32" y="201" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">EDU Assignments</text>
    <text x="32" y="218" fill="#64748b" font-family="monospace" font-size="10">assignments.edu.cloud.microsoft</text>

    <rect x="18" y="240" width="204" height="48" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="32" y="261" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600">Graph API &amp; SharePoint</text>
    <text x="32" y="278" fill="#64748b" font-family="monospace" font-size="10">graph.microsoft.com</text>

    <rect x="18" y="300" width="204" height="48" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="321" fill="#34d399" font-family="system-ui" font-size="12" font-weight="600">Teams Web App</text>
    <text x="32" y="338" fill="#64748b" font-family="monospace" font-size="10">teams.microsoft.com (UI DOM)</text>
  </g>

  <!-- Flow Arrows -->
  <!-- Col 1 to Col 2 -->
  <line x1="280" y1="290" x2="355" y2="290" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <polygon points="358,290 350,285 350,295" fill="#6366f1"/>

  <!-- Col 2 to Col 3 -->
  <line x1="600" y1="290" x2="675" y2="290" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <polygon points="678,290 670,285 670,295" fill="#0ea5e9"/>
</svg>
